name: Business Multi-Module E2E

on:
  workflow_dispatch:

concurrency:
  group: business-multi-e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  business-multi:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check API key
        id: key
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          if [ -z "$DEEPSEEK_API_KEY" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::warning::DEEPSEEK_API_KEY secret 未配置，跳过 business multi E2E"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare environment
        if: steps.key.outputs.skip != 'true'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          cp .env.example .env
          sed -i "s/your_key_here/$DEEPSEEK_API_KEY/" .env
          echo "BUSINESS_MVP_MAX_MODULES=2" >> .env

      - name: Start server
        if: steps.key.outputs.skip != 'true'
        env:
          BUSINESS_MVP_MAX_MODULES: "2"
        run: |
          export $(grep -v '^#' .env | xargs)
          python -m uvicorn main:app --host 127.0.0.1 --port 8000 --log-level warning &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/api/health >/dev/null; then
              echo "Server ready (BUSINESS_MVP_MAX_MODULES=$BUSINESS_MVP_MAX_MODULES)"
              exit 0
            fi
            sleep 2
          done
          echo "Server failed to start"
          exit 1

      - name: Run test_flow_business (multi mode)
        if: steps.key.outputs.skip != 'true'
        env:
          TEST_FLOW_BASE: http://127.0.0.1:8000
          TEST_FLOW_TIMEOUT: "2400"
          TEST_FLOW_BUSINESS_MODE: multi
          TEST_FLOW_EXPECT_MODULES: "2"
          BUSINESS_MVP_MAX_MODULES: "2"
        run: python test_flow_business.py

      - name: Notify on failure
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -n "$SLACK_WEBHOOK_URL" ]; then
            curl -sS -X POST -H 'Content-type: application/json' \
              --data "{\"text\":\"DevFlow CI business multi E2E failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
              "$SLACK_WEBHOOK_URL"
          fi

      - name: Upload deliveries on failure
        if: failure() && steps.key.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: business-multi-e2e-deliveries
          path: deliveries/
          if-no-files-found: ignore
