name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: python -m ruff check .

      - name: Syntax check (all modules)
        run: |
          python -m py_compile main.py config.py utils.py logging_config.py
          python -m py_compile database/models.py database/db.py
          python -m py_compile memory/case_store.py memory/project_memory.py
          python -m py_compile agents/*.py
          python -m py_compile workflow/*.py
          python -m py_compile api/*.py

      - name: Unit tests
        run: pytest tests/ -m "not integration" -v --tb=short --ignore=tests/test_executor_integration.py
        env:
          DEEPSEEK_API_KEY: test-key-for-ci
          DEEPSEEK_MODEL: deepseek-v4-pro

      - name: Integration tests (master only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: pytest tests/ -m integration -v --tb=short
        env:
          DEEPSEEK_API_KEY: test-key-for-ci
          DEEPSEEK_MODEL: deepseek-v4-pro
