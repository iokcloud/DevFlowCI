name: Learnings Cluster

on:
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:

jobs:
  cluster:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run learnings cluster
        run: python scripts/learnings_cluster.py
