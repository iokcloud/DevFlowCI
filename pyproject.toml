[project]
name = "DevFlowCI"
version = "0.4.7"
description = "自动化多 Agent 编码工作流系统 — 项目型开发伙伴"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "F",      # pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "SIM",    # flake8-simplify
]
ignore = [
    "E501",   # line-length handled by formatter
    "B008",   # FastAPI Depends 中使用函数调用是预期的
    "E402",   # UTC = timezone.utc 放在 import 间（Python 3.10 兼容）
    "UP017",  # datetime.UTC 需 Python 3.11+，保持 3.10 兼容
    "UP042",  # StrEnum 需 Python 3.11+，保持 3.10 兼容
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
# 这些文件充当"门面"，重导出其他模块的函数供外部使用
"workflow/executor.py" = ["F401"]
"workflow/sse_bridge.py" = ["F401"]
"main.py" = ["F401"]
"api/delivery.py" = ["F401"]
"api/streaming.py" = ["F401"]
"workflow/workflow_runner.py" = ["F401"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = false
warn_return_any = false
warn_unused_ignores = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"
timeout = 300
